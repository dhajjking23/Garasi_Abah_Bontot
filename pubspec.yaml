name: garasi_abah_bontot
description: "Sistem Pembukuan Jual Beli Motor - GARASI ABAH BONTOT"
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State Management
  flutter_riverpod: ^2.5.1

  # Database
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3

  # Formatting
  intl: ^0.19.0

  # UI
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0

  # Export
  pdf: ^3.11.1
  printing: ^5.13.1
  excel: ^4.0.6

  # File & Share
  share_plus: ^9.0.0
  file_picker: ^8.0.6
  permission_handler: ^11.3.1

  # Utility
  uuid: ^4.4.2
  equatable: ^2.0.5
  crypto: ^3.0.3
  http: ^1.2.1
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  sqflite_common_ffi: ^2.3.3
  path_provider_platform_interface: ^2.1.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
